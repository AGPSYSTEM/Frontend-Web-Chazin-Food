<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chazin Food - Deliciosas comidas rápidas artesanales: hamburguesas gourmet, salchipapas, perros calientes y combos. Pide en línea con entrega rápida." />
    <meta name="keywords" content="hamburguesas artesanales, comida rápida, salchipapas gourmet, perros calientes, combos, domicilios, Chazin Food" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#e30613" />

    <!-- Open Graph / Redes Sociales -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Chazin Food | Comidas Rápidas Artesanales" />
    <meta property="og:description" content="Deliciosas hamburguesas artesanales, salchipapas gourmet y combos. Pide online en Chazin Food." />
    <meta property="og:image" content="/favicon.png" />
    <meta property="og:url" content="http://localhost:5173/" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chazin Food | Comidas Rápidas Artesanales" />
    <meta name="twitter:description" content="Deliciosas hamburguesas artesanales, salchipapas gourmet y combos. Pide online en Chazin Food." />
    <meta name="twitter:image" content="/favicon.png" />

    <link rel="canonical" href="http://localhost:5173/" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" href="/favicon.png?v=2" />
    <title>Chazin Food | Comidas Rápidas Artesanales</title>

    <!-- Preload del emblema oficial del Splash Screen para LCP instantáneo (< 100ms) -->
    <link rel="preload" as="image" href="/favicon_256.webp" type="image/webp" fetchpriority="high" />

    <!-- Tipografía Inter oficial (Carga optimizada con display=swap) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Detección y persistencia inmediata de Modo Oscuro / Claro -->
    <script>
      (function() {
        try {
          var isDark = localStorage.getItem('chazin-dark') === 'true' ||
            (!('chazin-dark' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Estilos de Splash inicial Chazin Food (Acelerados por GPU, sin reflow de layout) -->
    <style>
      :root {
        --brand-red: #e30613;
      }
      body {
        margin: 0;
        background-color: #f8f9fa;
        color: #111827;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      html.dark body {
        background-color: #0e0e12;
        color: #f3f4f6;
      }
      .pre-loader-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f8f9fa;
        color: #111827;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        user-select: none;
        overflow: hidden;
        z-index: 99999;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      html.dark .pre-loader-screen {
        background-color: #0e0e12;
        color: #f3f4f6;
      }

      /* Físicas elásticas de Slime de Minecraft: Squash & Stretch en GPU */
      @keyframes preSlimeJump {
        0% { transform: translateY(0px) scale(1, 1); animation-timing-function: cubic-bezier(0.35, 1, 0.65, 1); }
        10% { transform: translateY(18px) scale(1.42, 0.58); animation-timing-function: cubic-bezier(0.2, 0.9, 0.3, 1.2); }
        22% { transform: translateY(-30px) scale(0.72, 1.38); animation-timing-function: ease-out; }
        45% { transform: translateY(-115px) scale(1.02, 0.98); animation-timing-function: ease-in; }
        68% { transform: translateY(-18px) scale(0.82, 1.25); animation-timing-function: cubic-bezier(0.7, 0, 0.85, 0); }
        76% { transform: translateY(18px) scale(1.5, 0.5); animation-timing-function: cubic-bezier(0.25, 1, 0.5, 1); }
        88% { transform: translateY(-7px) scale(0.95, 1.05); }
        100% { transform: translateY(0px) scale(1, 1); }
      }

      @keyframes preSlimeShadow {
        0% { transform: scale(1); opacity: 0.8; }
        10% { transform: scale(1.35, 1.15); opacity: 0.95; }
        45% { transform: scale(0.38, 0.38); opacity: 0.18; }
        76% { transform: scale(1.45, 1.2); opacity: 1; }
        88% { transform: scale(0.9, 0.9); opacity: 0.65; }
        100% { transform: scale(1); opacity: 0.8; }
      }

      /* Runner acelerado 100% por GPU compositor (transform: translateX + scaleX) sin forzar reflow de geometría */
      @keyframes preRunnerSlide {
        0% { transform: translateX(0%) scaleX(0.7); }
        50% { transform: translateX(110%) scaleX(1.3); }
        100% { transform: translateX(230%) scaleX(0.7); }
      }

      .pre-slime-actor {
        width: 220px;
        height: 220px;
        animation: preSlimeJump 1.3s infinite;
        transform-origin: bottom center;
        will-change: transform;
        filter: drop-shadow(0 12px 22px rgba(227, 6, 19, 0.32));
      }

      .pre-slime-shadow {
        width: 175px;
        height: 14px;
        border-radius: 9999px;
        margin-top: 10px;
        filter: blur(4px);
        background-color: rgba(0, 0, 0, 0.22);
        animation: preSlimeShadow 1.3s infinite;
        transform-origin: center center;
        will-change: transform, opacity;
      }

      html.dark .pre-slime-shadow {
        background-color: rgba(0, 0, 0, 0.75);
      }

      .pre-loader-label {
        margin-top: 45px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #6b7280;
        text-align: center;
      }

      html.dark .pre-loader-label {
        color: #8a8b94;
      }

      .pre-loader-track {
        position: relative;
        width: 190px;
        height: 2.5px;
        background-color: #e5e7eb;
        border-radius: 9999px;
        overflow: hidden;
        margin-top: 10px;
      }

      html.dark .pre-loader-track {
        background-color: #27282d;
      }

      .pre-loader-runner {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 30%;
        background-color: var(--brand-red);
        border-radius: 9999px;
        box-shadow: 0 0 8px rgba(227, 6, 19, 0.8);
        transform-origin: left center;
        will-change: transform;
        animation: preRunnerSlide 1.7s ease-in-out infinite alternate;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Splash Screen Oficial Chazin Food (Sustituido en cuanto React monta los componentes) -->
      <div class="pre-loader-screen" role="status" aria-label="Cargando Chazin Food">
        <div class="pre-slime-actor">
          <picture>
            <source srcset="/favicon_256.webp" type="image/webp" />
            <img
              src="/favicon_256.png"
              alt="Chazin Food"
              width="220"
              height="220"
              fetchpriority="high"
              loading="eager"
              decoding="sync"
              style="width: 100%; height: 100%; object-fit: contain; border-radius: 46px; filter: drop-shadow(0 10px 20px rgba(227, 6, 19, 0.35));"
            />
          </picture>
        </div>
        <div class="pre-slime-shadow"></div>

        <div class="pre-loader-label">CARGANDO DELICIAS</div>
        <div class="pre-loader-track">
          <div class="pre-loader-runner"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
